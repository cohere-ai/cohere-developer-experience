config:
  default: true
  MD009: false
  MD012: false
  MD013: false        # line length — irrelevant for Hugo
  MD033: false        # inline HTML — Fern JSX components
  MD041: false        # first-line-h1 — frontmatter pages
  MD060: false        # table column style — cosmetic
  MD036: false        # no-emphasis-as-heading — used decoratively
  MD045: false        # alt text — address separately
  MD025: false        # single h1 — frontmatter pages
  MD046: false        # fenced vs indented — style preference, not migration concern
  MD040: false        # missing code language — quality improvement, tackle separately
  MD024:              # duplicate headings — allow in different sections
    siblings_only: true
  MD034: false        # bare URLs — auto-fix wraps in <url> which breaks MDX parsing

ignores:
  - "fern/pages/-ARCHIVE-/**"
  - "node_modules/**"
  - "fern/pages/cookbooks.mdx"
  - "fern/pages/cookbooks/**"
  - "fern/pages/changelog/202[2-4]-*.mdx"
  - "fern/pages/changelog/release-notes.mdx"

