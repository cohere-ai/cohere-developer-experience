name: Notebook Secret Scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**.ipynb"

jobs:
  scan-notebooks:
    name: Scan notebooks for secrets and cell outputs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed notebooks
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only "origin/${BASE_REF}...HEAD" \
            | grep '\.ipynb$' > changed_notebooks.txt || true
          echo "count=$(wc -l < changed_notebooks.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.changed.outputs.count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install nbstripout
        if: steps.changed.outputs.count != '0'
        run: pip install nbstripout

      - name: Install trufflehog
        if: steps.changed.outputs.count != '0'
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Check for cell outputs
        if: steps.changed.outputs.count != '0'
        run: |
          FAIL=0
          while IFS= read -r nb; do
            [ -f "$nb" ] || continue
            if ! nbstripout --verify "$nb"; then
              python3 -c "
import json, sys
data = json.load(open(sys.argv[1]))
for i, cell in enumerate(data.get('cells', [])):
    outputs = cell.get('outputs', [])
    if outputs:
        types = ', '.join(sorted({o.get('output_type', 'unknown') for o in outputs}))
        print(f'  cell {i+1}: {len(outputs)} output(s) [{types}]')
" "$nb"
              echo "::error file=${nb}::Cell outputs found in $nb — run 'nbstripout $nb' to clear before merging."
              FAIL=1
            fi
          done < changed_notebooks.txt
          exit $FAIL

      - name: Scan for secrets
        if: steps.changed.outputs.count != '0'
        run: |
          FAIL=0
          while IFS= read -r nb; do
            [ -f "$nb" ] || continue
            trufflehog filesystem "$nb" --fail --no-update || FAIL=1
          done < changed_notebooks.txt
          exit $FAIL
