name: preview-docs

on:
  pull_request_target:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # Only for commenting
      contents: read       # For checking out code
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # with:
        #   ref: "${{ github.event.pull_request.merge_commit_sha }}"

      - name: Checkout PR
        if: |
          github.event_name == 'pull_request_target'
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-${{ github.event.pull_request.number }}
          git checkout pr-${{ github.event.pull_request.number }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        shell: bash
        run: pnpm install        

      - name: Run fern check
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: pnpm run docs:check

      - name: Generate preview URL
        id: generate-docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          set -uo pipefail
          STATUS=0
          OUTPUT=$(pnpm run docs:preview 2>&1) || STATUS=$?
          echo "$OUTPUT"
          if [[ "${STATUS}" -ne 0 ]]; then
            echo "::error::fern docs preview failed with exit code ${STATUS}"
            exit "${STATUS}"
          fi
          URL=$(printf '%s\n' "$OUTPUT" | grep -oP 'Published docs to \K.*(?= \()' || true)
          if [[ -z "${URL}" ]]; then
            echo "::error::Could not parse a preview URL from the fern output above"
            exit 1
          fi
          echo "Preview URL: $URL"
          echo "🌿 Preview your docs: $URL" > preview_url.txt
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment URL in PR
        uses: thollander/actions-comment-pull-request@v2.4.3
        with:
          filePath: preview_url.txt

    outputs:
      preview_url: ${{ steps.generate-docs.outputs.preview_url }}

  check-links:
    needs: run
    uses: ./.github/workflows/check-links.yml
    with:
      preview_url: ${{ needs.run.outputs.preview_url }}

  link-check:
    needs: [run, check-links]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Report link check outcome
        env:
          PREVIEW_RESULT: ${{ needs.run.result }}
          LINKS_RESULT: ${{ needs.check-links.result }}
        run: |
          echo "preview=${PREVIEW_RESULT} links=${LINKS_RESULT}"
          # Fork PRs skip preview generation, so there is no preview to crawl.
          if [[ "${PREVIEW_RESULT}" == "skipped" ]]; then
            exit 0
          fi
          if [[ "${LINKS_RESULT}" != "success" ]]; then
            echo "::error::Link check did not pass (preview=${PREVIEW_RESULT}, links=${LINKS_RESULT})"
            exit 1
          fi
