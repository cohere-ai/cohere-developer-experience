# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
api:
  specs:
    - openapi: ../../../cohere-openapi.yaml
      settings:
        title-as-schema-name: true
        type-dates-as-strings: true
        object-query-parameters: false
        idiomatic-request-names: false
        respect-nullable-schemas: false
        wrap-references-to-nullable-in-optional: true
        coerce-optional-schemas-to-nullable: true
        inline-path-parameters: false
        coerce-enums-to-literals: true
        filter:
          endpoints:
            - DELETE /v1/connectors/{id}
            - DELETE /v1/datasets/{id}
            - DELETE /v1/finetuning/finetuned-models/{id}
            - GET /v1/connectors
            - GET /v1/connectors/{id}
            - GET /v1/datasets
            - GET /v1/datasets/usage
            - GET /v1/datasets/{id}
            - GET /v1/embed-jobs
            - GET /v1/embed-jobs/{id}
            - GET /v1/finetuning/finetuned-models
            - GET /v1/finetuning/finetuned-models/{finetuned_model_id}/events
            - GET /v1/finetuning/finetuned-models/{finetuned_model_id}/training-step-metrics
            - GET /v1/finetuning/finetuned-models/{id}
            - GET /v1/models
            - GET /v1/models/{model}
            - PATCH /v1/connectors/{id}
            - PATCH /v1/finetuning/finetuned-models/{id}
            - POST /v1/chat
            - POST /v1/check-api-key
            - POST /v1/classify
            - POST /v1/connectors
            - POST /v1/connectors/{id}/oauth/authorize
            - POST /v1/datasets
            - POST /v1/detokenize
            - POST /v1/embed
            - POST /v1/embed-jobs
            - POST /v1/embed-jobs/{id}/cancel
            - POST /v1/finetuning/finetuned-models
            - POST /v1/generate
            - POST /v1/rerank
            - POST /v1/summarize
            - POST /v1/tokenize
            - STREAM /v1/chat
            - STREAM /v1/generate
